# 집 연습용 데이터 파이프라인
#  - oracle  : 데이터 계층 전부 (SRC_SCADA / PCS_LND..GOLD / PCS_CTL)  ← "Oracle 단일"
#  - postgres: Airflow 메타DB (인프라용. 데이터 아님)
#  - airflow : webserver + scheduler (LocalExecutor → worker/redis 불필요)
#
# 기동:  docker compose up -d --build
# UI:    http://localhost:8080   (airflow / airflow)
# Oracle: localhost:1521  service_name=FREEPDB1  (SYSTEM / oracle)

x-airflow-common: &airflow-common
  build: .
  image: pcs-airflow-practice:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Seoul"
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "120"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    ORA_PYTHON_DRIVER_TYPE: thin
    # --- 데이터 파이프라인용 Oracle 커넥션 (Airflow OracleHook / SqlSensor 가 사용) ---
    AIRFLOW_CONN_ORACLE_PCS: 'oracle://PCS_ETL:pcs_etl_pw@oracle:1521?service_name=FREEPDB1'
    # --- OpenLineage → Marquez (lineage + 런타임 헬스) ---
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"http","url":"http://marquez-api:5000","endpoint":"api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: 'pcs'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./common:/opt/airflow/common
    - ./transform:/opt/airflow/transform
    - ./tools:/opt/airflow/tools
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    oracle:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle          # SYS / SYSTEM 패스워드
    ports:
      - "1521:1521"
    volumes:
      - oracle-db:/opt/oracle/oradata
      # 최초 기동 시 1회 실행되는 초기화 스크립트 (유저/스키마/권한/원천DDL)
      - ./init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ---------- Marquez (OpenLineage 백엔드 + UI) ----------
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquez"]
      interval: 10s
      retries: 5

  marquez-api:
    image: marquezproject/marquez:0.50.0
    ports:
      - "5000:5000"   # OpenLineage API (이벤트 수신)
      - "5001:5001"   # admin/healthcheck
    environment:
      - MARQUEZ_PORT=5000
      - MARQUEZ_ADMIN_PORT=5001
      - POSTGRES_HOST=marquez-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=marquez
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
    depends_on:
      marquez-db:
        condition: service_healthy
    restart: on-failure

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    ports:
      - "3000:3000"   # 브라우저 UI
    environment:
      - MARQUEZ_HOST=marquez-api
      - MARQUEZ_PORT=5000
      - WEB_PORT=3000
    depends_on:
      - marquez-api
    restart: on-failure

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname a --lastname b --role Admin --email a@b.c || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db:
  oracle-db:
  marquez-db:
