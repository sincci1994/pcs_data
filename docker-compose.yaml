# PCS 오케스트레이션 서버 — Airflow(+dbt/Cosmos) 코어 + OpenMetadata
#  - postgres : Airflow 메타DB (인프라용. 데이터 아님 — 로컬 자급자족)
#  - airflow  : webserver + scheduler (LocalExecutor → worker/redis 불필요)
#  - 데이터 DB는 전부 외부 서버: 소스 Oracle·웨어하우스 Postgres 접속은 .env 로 주입
#  - 카탈로그(OpenMetadata)는 .env 의 COMPOSE_FILE 로 함께 병합·기동: platform/infra/openmetadata/  → adr/0005
#    (include: 는 Compose v2.20+ 전용이라 구버전 호환 위해 COMPOSE_FILE 병합을 쓴다.)
#
# 기동:  docker compose up -d --build   → 실행 7(코어 3 + OM 4) + 1회성 2(airflow-init·execute-migrate-all)
#        전제: .env 에 COMPOSE_FILE 세팅(→ .env.example). 코어는 빌드, OM 4종은 pull.
# UI:    http://localhost:8080 (airflow / airflow) · http://localhost:8585 (OpenMetadata)

x-airflow-common: &airflow-common
  build:
    context: .
    # 사내 프록시/미러/CA — 최상위 .env 값을 빌드 인자로 주입(빈값이면 no-op). 런타임엔 미주입.
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
      PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
  image: pcs-airflow-practice:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Seoul"
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "120"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    ORA_PYTHON_DRIVER_TYPE: thin
    # --- 소스 Oracle 커넥션 (외부 DB 서버 필수 — 호스트/포트/서비스는 .env 로 주입) ---
    AIRFLOW_CONN_ORACLE_PCS: 'oracle://PCS_ETL:${PCS_ETL_PASSWORD:-pcs_etl_pw}@${PCS_ORACLE_HOST}:${PCS_ORACLE_PORT:-1521}?service_name=${PCS_ORACLE_SERVICE:-FREEPDB1}'
    # --- 웨어하우스 Postgres 커넥션 (외부 DB 서버, design/09 — LND~GOLD·CTL) ---
    AIRFLOW_CONN_POSTGRES_WH: 'postgresql://${PCS_WH_USER:-pcs_wh}:${PCS_WH_PASSWORD:-}@${PCS_WH_HOST:-}:${PCS_WH_PORT:-5432}/${PCS_WH_DB:-pcs_wh}'
    # --- dbt(Cosmos) 가 profiles.yml env_var() 로 읽는 자격증명 ---
    PCS_DBT_USER: "${PCS_DBT_USER:-DBT_EXEC}"
    PCS_DBT_PASSWORD: "${PCS_DBT_PASSWORD:-dbt_exec_pw}"
    # OpenLineage 비활성 — 계보·카탈로그는 OpenMetadata(dbt ingestion)로 일원화. → adr/0005
    AIRFLOW__OPENLINEAGE__DISABLED: "true"
  # 호스트 트리(사람용/역할 기반) ↔ 컨테이너 경로(기계용/관례) 번역계층.
  # 컨테이너 안은 /opt/airflow/{dags,extract,common,transform,tools} 로 불변 →
  # import 문자열·Cosmos 경로·PYTHONPATH 는 호스트 재편과 무관하게 유지된다.
  volumes:
    - ./platform/dags:/opt/airflow/dags
    - ./platform/extract:/opt/airflow/extract
    - ./platform/common:/opt/airflow/common
    - ./transform:/opt/airflow/transform
    - ./dev/tools:/opt/airflow/tools
    - ./logs:/opt/airflow/logs
    - ./platform/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname a --lastname b --role Admin --email a@b.c || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db:
