# 소스 선언 — 이 파일의 블록 1개 = extract DAG 1개 + Asset 자동 생성
# 신규 소스 추가는 여기에 블록을 추가하는 것으로 끝난다 (파이썬 코드 작업 불필요).
#
# 필드:
#   conn             : 접속 env 접두사 (PCS_SRC → PCS_SRC_HOST/PORT/DB/USER/PASSWORD)
#   table            : 소스 테이블 (schema.table)
#   mode             : snapshot(전량 교체 — 기준정보·소용량) | watermark(증분+lookback — 계속 쌓이는
#                      누적형 소스용, 미구현: 첫 누적형 소스 실명세 확보 시 구현)
#   target           : bronze 테이블 (brz.<소스>__<엔티티>)
#   schedule         : cron (Asia/Seoul) — 파이프라인 전체 캐던스의 유일한 결정 지점.
#                      소스 적재 주기(grain)가 아니라 배치 추출 주기를 적는다
#                      (예: 소스가 5분 집계로 쌓여도 추출은 3시간 배치)
#   expected_columns : pre-flight 계약 체크 대상 (누락 시 fail-fast + 알림)
#   filter           : (선택) 추출 WHERE 절 — 리터럴 SQL 조건식

ees_portmaster2:
  conn: PCS_SRC
  table: src.pcs_sq_port_mst_2nd        # 원격: ees.pcs_sq_port_mst_2nd
  mode: snapshot
  target: brz.ees__portmaster2
  schedule: "0 1 * * *"
  expected_columns:
    [eqp_id, eqp_chamber_id, eqp_chamber_posn, eqp_posn,
     seqp_type, seqp_maker, seqp_model_code, seqp_id, seqp_ch, seqp_port, db_user]
  select_columns:
    [eqp_id, eqp_chamber_id, eqp_chamber_posn, eqp_posn,
     seqp_type, seqp_maker, seqp_model_code, seqp_id, seqp_ch, seqp_port]
  filter: "seqp_type IN ('PUMP', 'SCRUBBER') AND db_user = 'PF_PCS'"
