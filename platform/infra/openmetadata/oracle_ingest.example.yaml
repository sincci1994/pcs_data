# 사본을 oracle_ingest.yaml 로 만들고 값(비밀번호/JWT)을 채워 사용한다.
# 실제 oracle_ingest.yaml 은 .gitignore 로 커밋 금지(JWT 포함).
source:
  type: oracle
  serviceName: pcs_oracle
  serviceConnection:
    config:
      type: Oracle
      username: ${PCS_DBT_USER}          # 예: DBT_EXEC
      password: ${PCS_DBT_PASSWORD}
      hostPort: ${PCS_ORACLE_HOST}:1521  # 외부 Oracle 실서버 (OM 컨테이너에서 도달 가능한 주소)
      oracleConnectionType:
        oracleServiceName: ${PCS_ORACLE_SERVICE}
      databaseName: ${PCS_ORACLE_SERVICE}
  sourceConfig:
    config:
      type: DatabaseMetadata
      includeViews: true
      schemaFilterPattern:
        includes:
          - "^PCS_.*$"
          - "^SRC_SCADA$"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OPENMETADATA_JWT}"     # OM UI 에서 발급한 토큰. 절대 커밋하지 말 것.
