# 사본을 dbt_ingest.yaml 로 만들고 JWT 를 채워 사용한다.
# 실제 dbt_ingest.yaml 은 .gitignore 로 커밋 금지(JWT 포함).
source:
  type: dbt
  serviceName: pcs_oracle
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtManifestFilePath: /tmp/manifest.json
        dbtCatalogFilePath: /tmp/catalog.json
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: WARN
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OPENMETADATA_JWT}"     # OM UI 에서 발급한 토큰. 절대 커밋하지 말 것.
