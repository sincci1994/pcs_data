# 원천(SCADA) → PCS_LND 추출 DAG (DagFactory 가 이 YAML 로 DAG 생성)
scada_extract_daily:
  default_args:
    owner: home
    start_date: "2026-06-01"
    retries: 1
    retry_delay_sec: 120
  schedule_interval: "@daily"     # transform DAG 과 동일 logical date → ExternalTaskSensor 정렬 용이
  catchup: false
  description: "SCADA trace/마스터 → PCS_LND 증분 적재"
  tags: ["extract", "scada"]

  tasks:
    ctl_start:
      operator: airflow.operators.python.PythonOperator
      python_callable: extract.projects.scada.control.ctl_start

    extract_masters:
      operator: airflow.operators.python.PythonOperator
      python_callable: extract.projects.scada.masters.extract_masters
      dependencies: [ctl_start]

    extract_trace:
      operator: airflow.operators.python.PythonOperator
      python_callable: extract.projects.scada.trace.extract_trace
      dependencies: [ctl_start]

    ctl_end:
      operator: airflow.operators.python.PythonOperator
      python_callable: extract.projects.scada.control.ctl_end
      dependencies: [extract_masters, extract_trace]
