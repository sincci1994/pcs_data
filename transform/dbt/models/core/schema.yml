version: 2

models:
  - name: D_EQP
    description: "설비 차원"
    columns:
      - name: EQP_KEY
        tests: [not_null, unique]
  - name: D_SENSOR
    description: "센서 차원 (상/하한 포함)"
    columns:
      - name: SENSOR_KEY
        tests: [not_null, unique]
  - name: D_MGMT_LINE
    columns:
      - name: MGMT_LINE_KEY
        tests: [not_null, unique]
  - name: F_SENSOR_DAILY
    description: "설비×센서×일 집계 Fact"
    columns:
      - name: SENSOR_KEY
        tests:
          - not_null
          - relationships:
              to: ref('D_SENSOR')
              field: SENSOR_KEY
      - name: EQP_KEY
        tests:
          - not_null
          - relationships:
              to: ref('D_EQP')
              field: EQP_KEY
      - name: UPTIME_RATIO
        tests:
          - not_null
