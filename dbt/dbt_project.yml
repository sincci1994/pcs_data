# PCS 변환 프로젝트 — 계층: brz(소스, dbt 모델 아님) → slv → gld + sbx(실험)
# 명명·폴더 규칙 정본: design/10_NAMING_ORGANIZATION.md
name: pcs_transform
version: "1.0.0"
profile: pcs_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"

seeds:
  pcs_transform:
    +schema: slv   # seed = 큐레이션 참조 데이터 (수기표의 관리 테이블 승격, → design/09)

models:
  pcs_transform:
    slv:
      +schema: slv
      +materialized: view
    gld:
      +schema: gld
      +materialized: table
    sbx:
      +schema: sbx
      +materialized: table
      # sbx 는 실험 계층 — 수동 실행 전용, Manager/Publish/OM 제외 (→ design/07)
      +tags: ["sbx"]
