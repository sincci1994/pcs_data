# 컬럼 설명은 각 모델 .sql 헤더 주석에 — 이 파일은 테스트 정의만.
version: 2

models:
  - name: dim_equipment
    columns:
      - name: code
        tests: [unique, not_null]
      - name: type_code
        tests:
          - not_null
          - accepted_values:
              values: ["MAIN", "CHAMBER", "PUMP", "SCRUBBER", "SCRUBBER_NOR_VALVE",
                       "SCRUBBER_BYP_VALVE", "SCRUBBER_MERGE", "LATERAL_DUCT"]
      - name: main_equipment_code
        tests:
          - relationships:
              to: ref('dim_equipment')
              field: code
      - name: team_code
        tests: [not_null]
      - name: division_code
        tests: [not_null]
      - name: site_code
        tests: [not_null]
      - name: line_code
        tests: [not_null]
      - name: area_code
        tests: [not_null]
      - name: group_code
        tests: [not_null]
      - name: layer_order
        tests: [not_null]
      - name: vendor_code
        tests:
          - relationships:
              to: ref('dim_vendor')
              field: code

  - name: dim_pipe
    columns:
      - name: code
        tests: [unique, not_null]
      - name: type_code
        tests:
          - not_null
          - accepted_values:
              values: ["FORELINE", "PS", "SS", "ALLBYPASS", "SD1", "SD2"]
      - name: main_equipment_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_equipment')
              field: code
      - name: chamber_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_equipment')
              field: code
      - name: from_equipment_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_equipment')
              field: code
      - name: to_equipment_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_equipment')
              field: code
      - name: length_m
        tests: [not_null]
      - name: mtbf_days
        tests: [not_null]

  - name: dim_vendor
    columns:
      - name: code
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: type_code
        tests: [not_null]
